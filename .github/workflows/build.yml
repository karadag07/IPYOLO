name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Modeli CoreML'e cevir
        run: |
          pip install ultralytics coremltools
          python export_model.py

      - name: XcodeGen kur ve projeyi olustur
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Imzasiz build al
        run: |
          xcodebuild \
            -project YoloSeg.xcodeproj \
            -scheme YoloSeg \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA olustur
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YoloSeg.app Payload/
          zip -qr YoloSeg.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: YoloSeg-ipa
          path: YoloSeg.ipa
